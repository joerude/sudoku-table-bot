name: ci

# Every push of a work branch is tested as it would land on main. When that is
# green the same job opens the pull request and squash-merges it, so a pushed
# branch reaches main without a click. A branch named wip/... is tested but
# never merged.
on:
  push:
    branches: ['feat/**', 'fix/**', 'refactor/**', 'chore/**', 'docs/**', 'ci/**', 'wip/**']

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge main in, to test what will land
        run: |
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git merge --no-edit origin/main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt, vet, test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -vet=off ./...
      # --match-head-commit: merge only the commit that was tested. A push that
      # arrived meanwhile has its own run.
      - name: Open the pull request and squash-merge it
        if: ${{ !startsWith(github.ref_name, 'wip/') }}
        run: |
          if ! gh pr view "$BRANCH" --json state --jq .state | grep -qx OPEN; then
            gh pr create --base main --head "$BRANCH" --fill
          fi
          gh pr merge "$BRANCH" --squash --delete-branch --match-head-commit "$GITHUB_SHA"
